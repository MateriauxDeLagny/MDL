# Configuration Netlify (prioritaire sur les réglages de l'interface).
# Netlify détecte Next.js et applique automatiquement son adaptateur
# (pages, routes API /api/contact et /api/devis, optimisation d'images).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Version LTS de Node.js, compatible Next.js 15
  NODE_VERSION = "22"

# Domaine .com (alias Netlify) : redirection permanente vers le site en .fr.
# Sans effet tant que les DNS du .com ne pointent pas vers Netlify.
# Les emails @materiauxdelagny.com ne sont pas concernés (MX chez OVH).
[[redirects]]
  from = "https://materiauxdelagny.com/*"
  to = "https://www.materiauxdelagny.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.materiauxdelagny.com/*"
  to = "https://www.materiauxdelagny.fr/:splat"
  status = 301
  force = true

# Adaptateur officiel Next.js de Netlify, déclaré explicitement : sans lui,
# Netlify publie le dossier .next brut et toutes les pages renvoient 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
